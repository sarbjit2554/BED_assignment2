openapi: 3.0.0
info:
  title: Employee Directory and Branch Management API
  description: API documentation for Employee Directory and Branch Management
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/v1/branches:
    get:
      summary: Retrieve all branches
      responses:
        '200':
          description: A list of all branches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    location:
                      type: string
    post:
      summary: Create a new branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
      responses:
        '201':
          description: Branch created successfully
    put:
      summary: Update an existing branch
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the branch to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  type: string
      responses:
        '200':
          description: Branch updated successfully
    delete:
      summary: Delete a branch
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the branch to delete
          schema:
            type: integer
      responses:
        '204':
          description: Branch deleted successfully

  /api/v1/branches/{id}:
    get:
      summary: Get a branch by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the branch to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: The branch information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  location:
                    type: string

  /api/v1/employees:
    get:
      summary: Retrieve all employees
      responses:
        '200':
          description: A list of all employees
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    position:
                      type: string
    post:
      summary: Create a new employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                position:
                  type: string
      responses:
        '201':
          description: Employee created successfully

  /api/v1/employees/{id}:
    get:
      summary: Get an employee by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the employee to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Employee information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  position:
                    type: string
    put:
      summary: Update an existing employee
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the employee to update
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                position:
                  type: string
      responses:
        '200':
          description: Employee updated successfully
    delete:
      summary: Delete an employee
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the employee to delete
          schema:
            type: integer
      responses:
        '204':
          description: Employee deleted successfully

  /api/v1/employees/branch/{branchId}:
    get:
      summary: Get employees by branch ID
      parameters:
        - name: branchId
          in: path
          required: true
          description: The branch ID to retrieve employees for
          schema:
            type: integer
      responses:
        '200':
          description: A list of employees for the given branch
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    position:
                      type: string

  /api/v1/employees/department/{department}:
    get:
      summary: Get employees by department
      parameters:
        - name: department
          in: path
          required: true
          description: The department to retrieve employees for
          schema:
            type: string
      responses:
        '200':
          description: A list of employees for the given department
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    position:
                      type: string
